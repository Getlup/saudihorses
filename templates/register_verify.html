{% extends "base.html" %}
{% block content %}
<div class="container" style="padding:50px 24px 90px;">
  <div class="form-card">
    <h2>تفعيل الحساب</h2>
    <div class="sub">أدخل كود التحقق المُرسل إلى <bdi dir="ltr">{{ phone }}</bdi> واختر بيانات دخولك</div>
    <div class="steps-indicator">
      <span class="step is-done">1. رقم الجوال</span>
      <span class="step is-active">2. تفعيل الحساب</span>
    </div>
    <form method="POST">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="field">
        <label>كود التحقق</label>
        <input type="text" name="code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6"
               autocomplete="one-time-code" dir="ltr" placeholder="••••••" required autofocus>
      </div>
      <div class="field">
        <label>اسم المستخدم</label>
        <input type="text" name="username" dir="ltr" placeholder="لتسجيل الدخول لاحقًا" required>
        <div class="hint">4-30 حرفًا/رقمًا، يُستخدم لتسجيل الدخول بدل رقم الجوال</div>
      </div>
      <div class="field">
        <label>كلمة المرور</label>
        <input type="password" name="password" required minlength="8">
      </div>
      <button type="submit" class="btn btn-gold btn-block">تفعيل الحساب والدخول</button>
    </form>
    <form method="POST" action="{{ url_for('stable_register_resend', slug=stable.slug) }}" style="margin-top:16px;">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <button type="submit" class="btn btn-sm btn-ghost btn-block">لم يصلني الكود — إعادة الإرسال</button>
    </form>
  </div>
</div>
{% endblock %}
