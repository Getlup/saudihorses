{% extends "base.html" %}
{% block content %}
<div class="container" style="padding:40px 24px 90px;">
  <div class="form-card" style="max-width:640px;">
    <h2>إضافة حصان جديد</h2>
    <div class="sub">سجّل بيانات الحصان الأساسية ثم أضف السجل اليومي لاحقًا</div>
    <form method="POST" enctype="multipart/form-data">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="field-row">
        <div class="field">
          <label>اسم الحصان</label>
          <input type="text" name="name" required>
        </div>
        <div class="field">
          <label>السلالة</label>
          <input type="text" name="breed" placeholder="عربي أصيل">
        </div>
      </div>
      <div class="field-row">
        <div class="field">
          <label>اللون</label>
          <input type="text" name="color">
        </div>
        <div class="field">
          <label>الجنس</label>
          <select name="gender">
            <option value="">— غير محدد —</option>
            {% for g in genders %}
            <option value="{{ g }}">{{ g }}</option>
            {% endfor %}
          </select>
        </div>
      </div>
      <div class="field-row">
        <div class="field">
          <label>سنة الميلاد</label>
          <input type="number" name="birth_year" min="1990" max="2026">
        </div>
        <div class="field">
          <label>اسم الأب</label>
          <input type="text" name="sire_name">
        </div>
      </div>
      <div class="field">
        <label>اسم الأم</label>
        <input type="text" name="dam_name">
      </div>
      <div class="field">
        <label>نوع الخدمة</label>
        <select name="service_type">
          <option value="boarding">إيواء</option>
          <option value="training">تدريب</option>
          <option value="riding">ركوب</option>
          <option value="treatment">علاج</option>
        </select>
      </div>
      <div class="field">
        <label>نوع الملكية</label>
        <select name="owner_id">
          <option value="">ملك لـ {{ current_user.stable.name_ar }}</option>
          {% for o in horse_owners %}
          <option value="{{ o.id }}">إيواء — {{ o.name }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="field">
        <label>صورة الحصان</label>
        <input type="file" name="photo" accept="image/*">
      </div>
      <div class="field">
        <label>ملاحظات عامة</label>
        <textarea name="notes" rows="3"></textarea>
      </div>

      <div class="rail-divider" style="margin:20px 0;"><span class="mark"></span></div>
      <p style="color:var(--muted); font-size:.82rem; margin-bottom:14px;">بيانات الملف الموسّع — تظهر فقط لفريق الإسطبل ومالك الخيل</p>

      <div class="field-row">
        <div class="field">
          <label>رقم الشريحة/الجواز</label>
          <input type="text" name="chip_number">
        </div>
        <div class="field">
          <label>رقم الحظيرة</label>
          <input type="text" name="stall_number">
        </div>
      </div>
      <div class="field">
        <label>الحالة الصحية المهمة</label>
        <textarea name="health_notes" rows="2"></textarea>
      </div>
      <div class="field">
        <label>الحساسية</label>
        <textarea name="allergies" rows="2"></textarea>
      </div>
      <div class="field">
        <label>خطة التغذية</label>
        <textarea name="feeding_plan" rows="2"></textarea>
      </div>
      <div class="field-row">
        <div class="field">
          <label>اسم الطبيب البيطري</label>
          <input type="text" name="vet_name">
        </div>
        <div class="field">
          <label>تواصل البيطري</label>
          <input type="text" name="vet_contact" dir="ltr">
        </div>
      </div>
      <div class="field">
        <label>تنبيه مهم بالتعامل مع الحصان (سلوك، خطر، إلخ)</label>
        <textarea name="important_alert" rows="2"></textarea>
      </div>

      <button type="submit" class="btn btn-gold btn-block">حفظ الحصان</button>
    </form>
  </div>
</div>
{% endblock %}
