{% extends "base.html" %}
{% block content %}
<div class="container" style="padding:50px 24px 90px;">
  <div class="form-card">
    <h2>إنشاء حساب زائر</h2>
    <div class="sub">لحجز حصص الركوب والتدريب في {{ stable.name_ar }}</div>
    <div class="steps-indicator">
      <span class="step is-active">1. رقم الجوال</span>
      <span class="step">2. تفعيل الحساب</span>
    </div>
    <form method="POST">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="field">
        <label>الاسم الكامل</label>
        <input type="text" name="name" value="{{ name or '' }}" required>
      </div>
      <div class="field">
        <label>رقم الجوال</label>
        <input type="tel" name="phone" value="{{ phone or '' }}" placeholder="05XXXXXXXX" dir="ltr" required>
        <div class="hint">سنرسل لك كود تحقق برسالة نصية على هذا الرقم</div>
      </div>
      <button type="submit" class="btn btn-gold btn-block">إرسال كود التحقق</button>
    </form>
    <div class="sub" style="margin-top:22px;">لديك حساب بالفعل؟ <a href="{{ url_for('login') }}">تسجيل الدخول</a></div>
  </div>
</div>
{% endblock %}
