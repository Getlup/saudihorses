{% extends "base.html" %}
{% block content %}
<div class="container" style="padding:50px 24px 90px;">
  <div class="form-card">
    <h2>إنشاء حساب زائر</h2>
    <div class="sub">لحجز حصص الركوب والتدريب في {{ stable.name_ar }}</div>
    <form method="POST">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="field">
        <label>الاسم الكامل</label>
        <input type="text" name="name" required>
      </div>
      <div class="field">
        <label>البريد الإلكتروني</label>
        <input type="email" name="email" required>
      </div>
      <div class="field">
        <label>رقم الجوال</label>
        <input type="tel" name="phone" placeholder="05XXXXXXXX">
      </div>
      <div class="field">
        <label>كلمة المرور</label>
        <input type="password" name="password" required>
      </div>
      <button type="submit" class="btn btn-gold btn-block">إنشاء الحساب</button>
    </form>
    <div class="sub" style="margin-top:22px;">لديك حساب بالفعل؟ <a href="{{ url_for('login') }}">تسجيل الدخول</a></div>
  </div>
</div>
{% endblock %}
