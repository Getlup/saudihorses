{% extends "base.html" %}
{% block content %}
<div class="container" style="padding:50px 24px 90px;">
  <div class="form-card">
    <h2>{{ t('register.title') }}</h2>
    <div class="sub">{{ stable.name_ar }}</div>
    <form method="POST">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="field">
        <label>{{ t('register.name') }}</label>
        <input type="text" name="name" required>
      </div>
      <div class="field">
        <label>{{ t('register.email') }}</label>
        <input type="email" name="email" required>
      </div>
      <div class="field">
        <label>{{ t('register.phone') }}</label>
        <input type="tel" name="phone" placeholder="05XXXXXXXX" dir="ltr" required>
      </div>
      <div class="field">
        <label>{{ t('register.password') }}</label>
        <input type="password" name="password" required minlength="8">
      </div>
      <div class="field" style="display:flex; align-items:flex-start; gap:8px;">
        <input type="checkbox" name="terms_accepted" id="terms_accepted" required style="margin-top:5px; width:auto;">
        <label for="terms_accepted" style="margin:0; font-weight:normal; font-size:.88rem;">
          {{ t('register.terms_prefix') }} <a href="{{ url_for('terms') }}" target="_blank" rel="noopener">{{ t('register.terms_link') }}</a>
        </label>
      </div>
      <button type="submit" class="btn btn-gold btn-block">{{ t('register.submit') }}</button>
    </form>
    <div class="sub" style="margin-top:22px;">{{ t('register.have_account') }} <a href="{{ url_for('login') }}">{{ t('login.title') }}</a></div>
  </div>
</div>
{% endblock %}
